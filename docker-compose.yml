services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - db_data:/app/data
      - file_storage:/app/storage
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  db_data:
  file_storage:
